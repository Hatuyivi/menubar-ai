name: Build macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      - name: Build release binary
        run: swift build -c release

      - name: Create .app bundle
        run: |
          APP_NAME="MenuBarAI"
          APP_DIR=".build/release/${APP_NAME}.app"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"

          cp .build/release/App "${APP_DIR}/Contents/MacOS/${APP_NAME}"
          chmod +x "${APP_DIR}/Contents/MacOS/${APP_NAME}"

          cp Sources/App/Resources/Info.plist "${APP_DIR}/Contents/Info.plist"

          printf 'APPL????' > "${APP_DIR}/Contents/PkgInfo"

          echo "App bundle structure:"
          find "${APP_DIR}" -type f

      - name: Ad-hoc code sign
        run: |
          APP_DIR=".build/release/MenuBarAI.app"

          # Sign all binaries and frameworks inside the bundle first
          find "${APP_DIR}" -type f \( -name "*.dylib" -o -name "*.framework" \) | while read f; do
            codesign --force --sign - "$f" 2>/dev/null || true
          done

          # Sign the main executable
          codesign --force --sign - "${APP_DIR}/Contents/MacOS/MenuBarAI"

          # Sign the entire bundle
          codesign --force --deep --sign - "${APP_DIR}"

          # Verify
          codesign --verify --deep --strict "${APP_DIR}" && echo "Signature OK" || echo "Signature warning (non-fatal)"

      - name: Create DMG
        run: |
          APP_NAME="MenuBarAI"
          DMG_NAME="${APP_NAME}.dmg"
          APP_PATH=".build/release/${APP_NAME}.app"
          STAGING_DIR="/tmp/dmg-staging"

          mkdir -p "${STAGING_DIR}"
          cp -R "${APP_PATH}" "${STAGING_DIR}/"
          ln -s /Applications "${STAGING_DIR}/Applications"

          hdiutil create \
            -volname "${APP_NAME}" \
            -srcfolder "${STAGING_DIR}" \
            -ov \
            -format UDZO \
            "${DMG_NAME}"

          # Remove quarantine attribute from DMG
          xattr -cr "${DMG_NAME}" || true

          echo "DMG size: $(du -sh ${DMG_NAME})"

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MenuBarAI-dmg
          path: MenuBarAI.dmg
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MenuBar AI v1.0.${{ github.run_number }}
          body: |
            ## MenuBar AI — macOS Menubar App

            Native macOS menubar app with:
            - **Module 1**: Screen OCR — select area on screen, extract numbers via AI
            - **Module 2**: Floor Plan — detect rooms, place resizable colliders

            Supports Gemini, OpenRouter, and Cloudflare (free-tier models only).

            ### Install
            1. Download `MenuBarAI.dmg`
            2. Open DMG → drag app to Applications
            3. Launch — icon appears in menu bar
            4. Grant Screen Recording permission when prompted

            > **If macOS says "damaged":** Right-click the app → Open, or run in Terminal:
            > ```bash
            > xattr -cr /Applications/MenuBarAI.app
            > ```
          files: MenuBarAI.dmg
          draft: false
          prerelease: false
